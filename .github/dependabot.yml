version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    # Usar a branch padrão (main); nunca há auto-merge.
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    groups:
      lint-and-types:
        dependency-type: development
        patterns:
          - "eslint"
          - "eslint-config-next"
          - "typescript"
          - "@types/*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    groups:
      actions-updates:
        patterns:
          - "*"
    labels:
      - dependencies
