name: Profissionais Phase 9 Nonce CI

on:
  push:
    branches:
      - experiment/fase9-nonce-ci-v30
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profissionais-phase9-nonce-ci
  cancel-in-progress: true

jobs:
  nonce-poc:
    name: CI-only nonce CSP, SSR and hydration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CSP_PHASE9_NONCE_POC: "1"
      CSP_PHASE9_REPORT_ONLY: "0"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build Next.js in production mode with fake backend
        run: npm run build
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.60.0
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run nonce compatibility test
        run: npx playwright test --config=playwright.phase9.config.mjs tests/csp-phase9/nonce.spec.mjs
