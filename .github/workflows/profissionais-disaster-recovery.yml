name: Profissionais Disaster Recovery Drill

on:
  push:
    branches:
      - main
      - codex/post-homologation-quality-v30
      - hardening/post-audit-v1
    paths:
      - ".github/workflows/profissionais-disaster-recovery.yml"
      - "scripts/dr-ephemeral-exercise.sh"
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - "supabase/seed.sql"
      - "docs/DISASTER_RECOVERY_RUNBOOK.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/profissionais-disaster-recovery.yml"
      - "scripts/dr-ephemeral-exercise.sh"
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - "supabase/seed.sql"
      - "docs/DISASTER_RECOVERY_RUNBOOK.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profissionais-disaster-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    name: Ephemeral backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Execute isolated recovery drill
        run: scripts/dr-ephemeral-exercise.sh

      - name: Upload RTO summary only
        uses: actions/upload-artifact@v7
        with:
          name: ephemeral-dr-rto-summary
          path: dr-report/summary.md
          if-no-files-found: error
          retention-days: 30