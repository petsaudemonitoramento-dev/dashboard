name: Profissionais Phase 9 Hybrid Staging CI

on:
  push:
    branches:
      - implementation/fase9-hybrid-ci-v30
      - audit/fase9-release-gate-v30
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-homologation:
    name: Dynamic nonce / static baseline / ephemeral database
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CSP_PHASE9_STAGING_ENFORCE: "1"
      CSP_PHASE9_REPORT_ONLY: "0"
      VERCEL_ENV: ""
      VERCEL: ""

    steps:
      - name: Checkout isolated implementation branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked app dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Inventory static CSP attack surface
        run: node scripts/phase9-static-surface-audit.mjs

      - name: Test fail-closed staging activation gate
        run: node --experimental-strip-types --test tests/phase9-gate.test.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Start throwaway Supabase with synthetic seed
        run: supabase start

      - name: Expose only local public API settings
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$status_env" | sed -n 's/^API_URL=//p' | tr -d '"')"
          pub_key="$(printf '%s\n' "$status_env" | sed -n 's/^PUBLISHABLE_KEY=//p' | tr -d '"')"
          secret_key="$(printf '%s\n' "$status_env" | sed -n 's/^SECRET_KEY=//p' | tr -d '"')"
          if [ -z "$secret_key" ]; then
            secret_key="$(printf '%s\n' "$status_env" | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')"
          fi
          database_url="$(printf '%s\n' "$status_env" | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test "$api_url" = "http://127.0.0.1:54321" || {
            echo "::error::Supabase not ephemeral localhost; refusing to test"
            exit 1
          }
          test -n "$pub_key" || {
            echo "::error::Missing publishable test key"
            exit 1
          }
          test -n "$secret_key" || {
            echo "::error::Missing ephemeral server-only test key"
            exit 1
          }
          case "$database_url" in
            postgresql://postgres:*@127.0.0.1:54322/postgres) ;;
            *)
              echo "::error::Database is not ephemeral localhost; refusing fixtures"
              exit 1
              ;;
          esac
          echo "::add-mask::$pub_key"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$database_url"
          echo "NEXT_PUBLIC_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$pub_key" >> "$GITHUB_ENV"
          echo "PHASE9_TEST_SUPABASE_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "PHASE9_TEST_DATABASE_URL=$database_url" >> "$GITHUB_ENV"

      - name: Build hybrid security policy on synthetic backend
        run: npm run build

      - name: Verify auth routes are dynamic in first build
        run: node scripts/phase9-auth-rendering-check.mjs first .phase9-auth-first.json

      - name: Rebuild independently for rendering reproducibility
        run: |
          rm -rf .next
          npm run build

      - name: Verify auth routes are dynamic in second build
        run: node scripts/phase9-auth-rendering-check.mjs second .phase9-auth-second.json .phase9-auth-first.json

      - name: Compare identical endpoint with CSP disabled and enabled
        run: node scripts/phase9-same-endpoint-benchmark.mjs

      - name: Exercise disposable CSP rollback
        run: node scripts/phase9-rollback-drill.mjs

      - name: Supabase database lint
        run: supabase db lint --local --level error

      - name: Database security and RLS assertions
        run: supabase test db

      - name: Prepare synthetic authenticated fixtures
        run: node scripts/phase9-synthetic-e2e-fixtures.mjs

      - name: Expose ephemeral server-only application settings
        shell: bash
        run: |
          echo "SUPABASE_SECRET_KEY=$PHASE9_TEST_SUPABASE_SECRET_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DATABASE_URL=$PHASE9_TEST_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Install pinned Playwright and axe
        run: npm install --no-save --package-lock=false @playwright/test@1.60.0 @axe-core/playwright@4.13.0

      - name: Install headless Chromium only
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser regression, enforced CSP and synthetic latency sample
        run: npx playwright test --config=playwright.phase9.staging.config.mjs

      - name: Public auth accessibility under enforced CSP
        env:
          PLAYWRIGHT_USE_PRODUCTION_BUILD: "1"
        run: npx playwright test --config=playwright.a11y.config.mjs

      - name: Destroy local Supabase (no backups or sensitive artifacts)
        if: always()
        run: supabase stop --no-backup || true