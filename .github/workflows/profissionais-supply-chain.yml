name: Profissionais Weekly Dependency Audit

on:
  schedule:
    - cron: "31 6 * * 0"
  workflow_dispatch:
  push:
    branches:
      - quality/parallel-ops-perf-supply-v30
    paths:
      - ".github/workflows/profissionais-supply-chain.yml"
      - "scripts/check-supply-chain.mjs"
      - "package-lock.json"
      - ".github/dependabot.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Production audit gate and dev-tooling watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit package-lock (no install or build)
        run: node scripts/check-supply-chain.mjs
